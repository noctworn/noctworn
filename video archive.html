<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="icon" href="logo.ico" type="image/x-icon">
	
    <title>𝔑𝔬𝔠𝔱𝔴𝔬𝔯𝔫 — Video Archive</title>

    <style>
        /* ==============================
           ОСНОВНЫЕ НАСТРОЙКИ
           ============================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #080808;
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.82)
                ),
                url("images/Noctworn.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: #aaa;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* ==============================
           ШАПКА
           ============================== */

        header {
            padding: 32px 15px 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #ddd;
            font-size: 38px;
            font-weight: normal;
            letter-spacing: 7px;
        }

        /* ==============================
           ОСНОВНОЙ КОНТЕНТ
           ============================== */

        main {
            width: 100%;
            max-width: 940px;
            margin: 35px auto 55px;
            padding: 0 24px;
        }

        .archive-title {
            margin: 0 0 40px;
            padding-bottom: 18px;
            border-bottom: 1px solid #292323;

            color: #c5baba;
            font-size: 22px;
            font-weight: normal;
            letter-spacing: 3px;
            text-align: center;
        }

        /* ==============================
           КАРТОЧКА ВИДЕО
           ============================== */

        .video-entry {
            position: relative;
            isolation: isolate;
            margin: 60px 0;
            padding: 28px 24px 26px;

            background-color: rgba(3, 3, 3, 0.84);
            border: 1px solid #514747;
            outline: 1px solid rgba(95, 85, 85, 0.3);
            outline-offset: 5px;

            box-shadow:
                inset 0 0 0 5px rgba(0, 0, 0, 0.65),
                inset 0 0 25px rgba(30, 0, 0, 0.12),
                0 12px 35px rgba(0, 0, 0, 0.5);

            /* Декоративные углы */
            background-image:
                linear-gradient(#706363, #706363),
                linear-gradient(#706363, #706363),
                linear-gradient(#706363, #706363),
                linear-gradient(#706363, #706363),
                linear-gradient(#706363, #706363),
                linear-gradient(#706363, #706363),
                linear-gradient(#706363, #706363),
                linear-gradient(#706363, #706363);

            background-size:
                24px 1px, 1px 24px,
                24px 1px, 1px 24px,
                24px 1px, 1px 24px,
                24px 1px, 1px 24px;

            background-position:
                top 10px left 10px,
                top 10px left 10px,
                top 10px right 10px,
                top 10px right 10px,
                bottom 10px left 10px,
                bottom 10px left 10px,
                bottom 10px right 10px,
                bottom 10px right 10px;

            background-repeat: no-repeat;
        }

        /* Декоративные символы по углам */

        .video-entry::before {
            content: "✧";
            position: absolute;
            z-index: 2;
            top: -22px;
            left: -17px;

            color: #aaa0a0;
            font-size: 27px;
            line-height: 1;
            text-shadow: 0 0 8px rgba(120, 20, 20, 0.35);

            pointer-events: none;
        }

        .video-entry::after {
            content: "✧";
            position: absolute;
            z-index: 2;
            right: -17px;
            bottom: -22px;

            color: #aaa0a0;
            font-size: 27px;
            line-height: 1;
            text-shadow: 0 0 8px rgba(120, 20, 20, 0.35);

            pointer-events: none;
        }

        /* Название записи */

        .video-entry h3 {
            margin: 0 0 12px;
            padding: 0 0 13px;

            border-bottom: 1px solid #393131;

            color: #d0c7c7;
            font-size: 17px;
            font-weight: normal;
            letter-spacing: 2px;
            line-height: 1.7;
            text-transform: uppercase;

            overflow-wrap: anywhere;
        }

        .video-entry h3::before {
            content: "☽ ";
            color: #887777;
            font-size: 16px;
        }

        /* Дата и описание */

        .video-entry p {
            margin: 0 0 22px;

            color: #898080;
            font-size: 13px;
            letter-spacing: 0.5px;
            line-height: 1.7;
        }

        /* ==============================
           РАМКА ВОКРУГ ВИДЕО
           ============================== */

        .video-frame {
            position: relative;
            width: 100%;
            padding: 8px;

            background: #050505;
            border: 1px solid #494141;
            box-shadow:
                0 0 0 2px #171313,
                inset 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .video-frame video {
            display: block;
            width: 100%;
            max-height: 500px;

            background: #000;
            border: 1px solid #252020;
        }

        /* ==============================
           ТЕКСТ В КОНЦЕ АРХИВА
           ============================== */

        .empty {
            margin: 55px 0 20px;
            padding: 20px 0;

            color: #666;
            font-size: 13px;
            letter-spacing: 1px;
            line-height: 1.8;
            text-align: center;
        }

        /* ==============================
           ПОДВАЛ
           ============================== */

        footer {
            padding: 30px 15px;
            border-top: 1px solid #222;

            color: #555;
            font-size: 12px;
            letter-spacing: 2px;
            text-align: center;
        }

        /* ==============================
           МОБИЛЬНАЯ ВЕРСИЯ
           ============================== */

        @media (max-width: 600px) {
            body {
                background-attachment: scroll;
            }

            header {
                padding: 26px 12px 20px;
            }

            header h1 {
                font-size: 27px;
                letter-spacing: 4px;
            }

            main {
                margin-top: 25px;
                padding: 0 18px;
            }

            .archive-title {
                font-size: 18px;
                letter-spacing: 2px;
            }

            .video-entry {
                margin: 45px 0;
                padding: 22px 14px 18px;
            }

            .video-entry h3 {
                font-size: 14px;
                letter-spacing: 1px;
            }

            .video-entry p {
                font-size: 12px;
            }

            .video-entry::before {
                left: -10px;
                font-size: 22px;
            }

            .video-entry::after {
                right: -10px;
                font-size: 22px;
            }

            .video-frame {
                padding: 5px;
            }
        }
    </style>
</head>

<body>

</body>
</html>
